  #   name: Bagimlilik incelemesi
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/dependency-review-action@v4
  #       with:
  #         fail-on-severity: high
