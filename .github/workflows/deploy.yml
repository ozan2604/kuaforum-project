name: Dagitim

# Surum akisi (ADR-006):
#
#   ozellik dali -> PR (CI gecmeli) -> main -> TEST (otomatik)
#                                              |
#                                          v* etiketi -> CANLI
#
# Canliya cikis bilincli bir eylem: etiket atmadan hicbir sey canliya gitmez.
# Etiketin kendisi denetim izidir — hangi commit'in ne zaman yayinlandigi
# git gecmisinde duruyor.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      hedef:
        description: 'Dagitim hedefi'
        required: true
        default: test
        type: choice
        options: [test, canli]

concurrency:
  # Ayni hedefe es zamanli dagitim yapilmasin; sirada bekleyen iptal EDILMEZ.
  group: dagitim-${{ startsWith(github.ref, 'refs/tags/v') && 'canli' || 'test' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: KuaforumAPI.sln

  # Ozel alan adi kullaniliyor: Azure'in varsayilan adresi App Service
  # erisim kisitlamasi ile Cloudflare disina kapatildi. Varsayilan adres
  # uzerinden test etmek zaten engellenir — ve engellenmese bile Cloudflare
  # katmanini atlayarak gercek yolu test etmemis olurdu.
  TEST_URL: https://api-test.salonbir.com
  CANLI_URL: https://api.salonbir.com

jobs:
  # ── Tek kez derle, iki hedefte de ayni cikti kullanilsin ───────────────────
  build:
    name: Derle ve paketle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore $SOLUTION

      - run: dotnet build $SOLUTION --configuration Release --no-restore

      # Dagitilacak sey testten gecmis olmali. CI ayrica calisiyor olsa da
      # buradaki kontrol, dagitim yolunun kendi guvencesi.
      - name: Testler
        run: dotnet test $SOLUTION --configuration Release --no-build

      - name: Yayimlama paketi
        run: >
          dotnet publish src/Presentation/KuaforumAPI.WebAPI/KuaforumAPI.WebAPI.csproj
          --configuration Release --no-build --output ./yayim

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./yayim
          retention-days: 7

  # ── main -> TEST ───────────────────────────────────────────────────────────
  test-ortami:
    name: TEST ortamina dagit
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.hedef == 'test')
    environment:
      name: test
      url: https://api-test.salonbir.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: api
          path: ./yayim

      - name: Azure Web App'e dagit
        uses: azure/webapps-deploy@v3
        with:
          app-name: salonbir-api-test
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TEST }}
          package: ./yayim

      # Test API'si Cloudflare Access arkasinda; jetonsuz istekler giris
      # sayfasina yonlendiriliyor ve /test/* uclari hic sinanamiyor.
      - name: Duman testi
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: ./scripts/duman-testi.sh "$TEST_URL" test

  # ── v* etiketi -> CANLI ────────────────────────────────────────────────────
  canli:
    name: CANLI ortama dagit
    needs: build
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.hedef == 'canli')
    environment:
      name: canli
      url: https://api.salonbir.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: api
          path: ./yayim

      - name: Azure Web App'e dagit
        uses: azure/webapps-deploy@v3
        with:
          app-name: salonbir-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./yayim

      # Canlida duman testi kirilirsa dagitim geri alinmaz — ama derhal
      # gorunur olur. Otomatik geri alma, slot swap'e gecince mumkun olacak.
      - name: Duman testi
        run: ./scripts/duman-testi.sh "$CANLI_URL" canli
